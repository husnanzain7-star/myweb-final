<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <!-- SIGN IN -->
    <div class="form sign-in">
        <h2>Welcome Back</h2>

        <form id="loginForm">

            <label>
                <span>Username</span>
                <input type="text" id="username" required>
            </label>

            <label>
                <span>Password</span>
                <input type="password" id="password" required>
            </label>

            <button type="submit" class="submit">
                Sign In
            </button>

            <div id="alertBox"
                 style="display:none;margin-top:10px;">
            </div>

        </form>
    </div>

    <!-- SIGN UP -->
    <div class="form sign-up">
        <h2>Create Account</h2>

        <form id="registerForm">

            <label>
                <span>Username</span>
                <input type="text"
                       id="regUsername"
                       required>
            </label>

            <label>
                <span>Email</span>
                <input type="email"
                       id="regEmail"
                       required>
            </label>

            <label>
                <span>Password</span>
                <input type="password"
                       id="regPassword"
                       required>
            </label>

            <button type="submit" class="submit">
                Sign Up
            </button>

            <div id="registerAlert"
                 style="display:none;margin-top:10px;">
            </div>

        </form>
    </div>

</div>

<script src="login.js"></script>
<script src="register.js"></script>

</body>
</html>
