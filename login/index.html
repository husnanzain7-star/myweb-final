<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Register</title>

    <link rel="stylesheet" href="login.css">
</head>
<body>

<br><br>

<div class="cont">

    <!-- SIGN IN -->
    <div class="form sign-in">

        <h2>Welcome</h2>

        <form id="loginForm">

            <label>
                <span>Username</span>
                <input type="text"
                       id="username"
                       required>
            </label>

            <label>
                <span>Password</span>
                <input type="password"
                       id="password"
                       required>
            </label>

            <p class="forgot-pass">
                Forgot password?
            </p>

            <button type="submit" class="submit">
                Sign In
            </button>

        </form>

        <div id="alertBox"></div>

    </div>

    <!-- SIGN UP -->
    <div class="sub-cont">

        <div class="img">

            <div class="img__text m--up">
                <h2>New here?</h2>
                <p>Sign up and discover</p>
            </div>

            <div class="img__text m--in">
                <h2>Already have account?</h2>
                <p>Sign in here</p>
            </div>

            <div class="img__btn">
                <span class="m--up">Sign Up</span>
                <span class="m--in">Sign In</span>
            </div>

        </div>

        <div class="form sign-up">

            <h2>Create Account</h2>

            <form id="registerForm">

                <label>
                    <span>Username</span>
                    <input type="text"
                           id="regUsername"
                           required>
                </label>

                <label>
                    <span>Email</span>
                    <input type="email"
                           id="regEmail"
                           required>
                </label>

                <label>
                    <span>Password</span>
                    <input type="password"
                           id="regPassword"
                           required>
                </label>

                <button type="submit" class="submit">
                    Sign Up
                </button>

            </form>

            <div id="registerAlert"></div>

        </div>

    </div>

</div>

<script>

document.querySelector('.img__btn')
.addEventListener('click', function () {

    document.querySelector('.cont')
    .classList.toggle('s--signup');

});

</script>

<script src="login.js"></script>
<script src="register.js"></script>

</body>
</html>
